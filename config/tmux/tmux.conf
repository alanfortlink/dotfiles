# tmux config — self-contained. Base settings first, then the ctrl+shift
# "direct" layer that mirrors ~/.config/herdr/config.toml key for key.
#
# On the Linux box ALT is the window manager's modifier, so most alt+ chords
# never reach tmux and the direct layer uses ctrl+shift instead; alt+g is left
# unbound in the WM and does pass through. The terminal has to send those
# chords as CSI-u — ghostty/kitty/wezterm do (see config/ghostty/config, where
# ctrl+shift+{j,t,o,e,p,left,right} are unbound and ctrl+1..9 are passed
# through), Terminal.app does not. The prefix+<key> bindings work anywhere.
#
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane.

# ======================================================================= base

# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show tmux keybindings" ? display-popup -E -w 80% -h 70% -T "tmux keybindings" "tmux list-keys -N | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
# Refresh connection-specific values on attach so new panes do not inherit a
# stale SSH session from the long-lived tmux server.
set -ag update-environment 'SSH_CLIENT SSH_TTY COLORTERM'
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# ================================================================== overrides

# ghostty is xterm-ghostty; Omarchy only enables extended keys for xterm-kitty.
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:RGB'

# Panes — herdr defaults + ctrl+shift direct layer
# (Omarchy binds prefix+h to split; herdr uses prefix+hjkl for focus.)
bind -N "Focus pane left"  h select-pane -L
bind -N "Focus pane down"  j select-pane -D
bind -N "Focus pane up"    k select-pane -U
bind -N "Focus pane right" l select-pane -R
bind -N "Focus pane left"  -n C-S-H select-pane -L
bind -N "Focus pane down"  -n C-S-J select-pane -D
bind -N "Focus pane up"    -n C-S-K select-pane -U
bind -N "Focus pane right" -n C-S-L select-pane -R

bind -N "Split pane side by side" v split-window -h -c "#{pane_current_path}"
bind -N "Split pane side by side" -n C-S-O split-window -h -c "#{pane_current_path}"
bind -N "Split pane stacked" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane stacked" n split-window -v -c "#{pane_current_path}"
bind -N "Split pane stacked" -n C-S-E split-window -v -c "#{pane_current_path}"

# Closing a pane that is running something (an agent, nvim, ...) asks first;
# a pane sitting at a shell prompt closes immediately. Same for ALT+W via
# hypr-mux-close.
bind -N "Kill pane (confirm if busy)" x run-shell 'tmux-kill-pane-confirm "#{pane_id}" "#{client_tty}"'
bind -N "Kill pane (confirm if busy)" -n C-S-X run-shell 'tmux-kill-pane-confirm "#{pane_id}" "#{client_tty}"'

bind -N "Zoom pane" z resize-pane -Z
bind -N "Zoom pane" -n C-S-Z resize-pane -Z
bind -N "Copy mode" -n C-S-Y copy-mode
# resize: ctrl+alt+shift+arrows (Omarchy default, same as herdr)

# Tabs (windows)
bind -N "Create window" -n C-S-T new-window -c "#{pane_current_path}"
bind -N "Previous window" Left  previous-window
bind -N "Next window"     Right next-window
bind -N "Previous window" -n C-S-Left  previous-window
bind -N "Next window"     -n C-S-Right next-window
bind -N "Switch to window 1" -n C-1 select-window -t 1
bind -N "Switch to window 2" -n C-2 select-window -t 2
bind -N "Switch to window 3" -n C-3 select-window -t 3
bind -N "Switch to window 4" -n C-4 select-window -t 4
bind -N "Switch to window 5" -n C-5 select-window -t 5
bind -N "Switch to window 6" -n C-6 select-window -t 6
bind -N "Switch to window 7" -n C-7 select-window -t 7
bind -N "Switch to window 8" -n C-8 select-window -t 8
bind -N "Switch to window 9" -n C-9 select-window -t 9

# Navigator — fuzzy jump to a session, window, or zoxide dir (herdr-navigator)
bind -N "Jump to anything" g run-shell -b 'tmux-navigator "#{client_tty}"'
bind -N "Jump to anything" t run-shell -b 'tmux-navigator "#{client_tty}"'
bind -N "Jump to anything" -n C-S-G run-shell -b 'tmux-navigator "#{client_tty}"'
bind -N "Jump to anything" -n C-S-P run-shell -b 'tmux-navigator "#{client_tty}"'
bind -N "Jump to anything" -n M-g run-shell -b 'tmux-navigator "#{client_tty}"'

# Copy mode: vi keys (Omarchy) + rectangle select; a mouse drag only selects,
# y copies.
bind -N "Toggle rectangle selection" -T copy-mode-vi C-v send -X rectangle-toggle
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode MouseDragEnd1Pane

# Theme — herdr's [theme.custom] look: white accent, dark text on the accent
# for the active tab, inactive borders that fade into the background. Named
# colors only, so it takes the terminal palette; on the Linux box that means
# `omarchy theme set` repaints it for free.
set -g status-left "#[fg=black,bg=white,bold] #S #[bg=default] "
set -g status-right "#[fg=white]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-current-format "#[fg=white,bold] #I:#W "
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=white"
set -g message-style "bg=default,fg=white"
set -g message-command-style "bg=default,fg=white"
set -g mode-style "bg=white,fg=black"
setw -g clock-mode-colour white

# Plugins (tpm): tmux-resurrect saves/restores sessions across reboots
# (prefix+ctrl+s / prefix+ctrl+r), the counterpart of herdr's session restore.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run -b '~/.tmux/plugins/tpm/tpm'
