bindd = ALT SHIFT, G, Caption GIF, exec, gif-captioner
bindd = ALT SHIFT, O, OCR region, exec, ~/.config/hypr/scripts/ocr-region.sh

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
