# Deadlock build overlay — floating, pinned, never steals focus.
# Class comes from the GTK app-id "dev.local.deadlock.overlay".
windowrule = float on,            match:class ^(dev\.local\.deadlock\.overlay)$
windowrule = pin on,              match:class ^(dev\.local\.deadlock\.overlay)$
windowrule = no_initial_focus on, match:class ^(dev\.local\.deadlock\.overlay)$
windowrule = rounding 10,         match:class ^(dev\.local\.deadlock\.overlay)$
windowrule = move (monitor_w-window_w-40) (monitor_h*0.05), match:class ^(dev\.local\.deadlock\.overlay)$

# ALT+F11 = show/hide,  ALT+F12 = fuzzy hero picker  (drag with SUPER + left-mouse)
# ALT+F9 / ALT+F10 = previous / next build (cycle the top community builds)
# ALT+F8 = expand/collapse full ability descriptions
bind = ALT, F11, exec, ~/deadlock-overlay/dlctl toggle
bind = ALT, F12, exec, ~/deadlock-overlay/dlctl pick
bind = ALT, F9,  exec, ~/deadlock-overlay/dlctl prev
bind = ALT, F10, exec, ~/deadlock-overlay/dlctl next
bind = ALT, F8,  exec, ~/deadlock-overlay/dlctl info
